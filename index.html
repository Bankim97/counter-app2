<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>COUNTER</title>

  <link rel="apple-touch-icon" href="./C.png">
  <link rel="icon" href="./C.png">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main class="counter-app">

    <div class="counter-list">

      <div class="counter-row" data-floor="2F">

        <div class="floor">
          2F
        </div>

        <div
          class="count"
          id="count-2F"
        >
          000
        </div>

        <button
          class="control-button minus"
          data-action="minus"
          type="button"
        >
          −
        </button>

        <button
          class="control-button plus"
          data-action="plus"
          type="button"
        >
          +
        </button>

      </div>


      <div class="counter-row" data-floor="1F">

        <div class="floor">
          1F
        </div>

        <div
          class="count"
          id="count-1F"
        >
          000
        </div>

        <button
          class="control-button minus"
          data-action="minus"
          type="button"
        >
          −
        </button>

        <button
          class="control-button plus"
          data-action="plus"
          type="button"
        >
          +
        </button>

      </div>


      <div class="counter-row" data-floor="B1">

        <div class="floor">
          B1
        </div>

        <div
          class="count"
          id="count-B1"
        >
          000
        </div>

        <button
          class="control-button minus"
          data-action="minus"
          type="button"
        >
          −
        </button>

        <button
          class="control-button plus"
          data-action="plus"
          type="button"
        >
          +
        </button>

      </div>


      <div class="counter-row b2-row">

        <div class="floor">
          B2
        </div>

        <div
          class="b2-status"
          id="b2-status"
        >
          -
        </div>

        <button
          class="control-button open-button"
          id="open-button"
          type="button"
          aria-label="OPEN"
        ></button>

        <button
          class="control-button close-button"
          id="close-button"
          type="button"
          aria-label="CLOSE"
        ></button>

      </div>

    </div>


    <div class="bottom-buttons">

      <button
        id="reset-button"
        class="bottom-button"
        type="button"
      >
        RESET
      </button>

      <button
        id="excel-button"
        class="bottom-button"
        type="button"
      >
        EXCEL DOWNLOAD
      </button>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script src="./app.js"></script>

</body>
</html>
